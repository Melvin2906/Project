# Une seule origine pour tout : le navigateur ne parle qu'à nginx, qui
# répartit vers les deux backends. Plus aucun problème de CORS.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fichiers joints (PDF, images) envoyés au chat.
    client_max_body_size 25m;

    # /api/auth/login  ->  http://auth:3000/login
    location /api/auth/ {
        proxy_pass http://auth:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /api/chat/ask  ->  http://chat:5000/ask
    location /api/chat/ {
        proxy_pass http://chat:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Les réponses du modèle et la génération d'images sont lentes.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Fichiers produits par Vite : leur nom contient un hash, on peut
    # les mettre en cache longtemps sans risque.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Application monopage : toute autre route renvoie index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
