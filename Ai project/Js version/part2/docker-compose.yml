# Bouchoura — toute la stack en une commande :  docker compose up --build
# Puis ouvre http://localhost:8080
#
# Lit le fichier .env à la racine (le même que tu utilises déjà) pour les
# secrets. Seules les valeurs qui changent dans Docker sont réécrites ici.

name: bouchoura

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit être défini dans .env}
      MYSQL_DATABASE: ${DB_NAME:-chatbot}
    volumes:
      - mysql-data:/var/lib/mysql
      # Exécuté UNE SEULE FOIS, au premier démarrage, sur un volume vide.
      - ./database/chatbotdb.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    # Décommente pour inspecter la base depuis ta machine (3307 évite le
    # conflit avec un MySQL déjà installé sur l'hôte).
    # ports:
    #   - "3307:3306"

  auth:
    build:
      context: .
      dockerfile: docker/auth.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: mysql
      PORT: "3000"
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      mysql:
        condition: service_healthy

  chat:
    build:
      context: .
      dockerfile: docker/chat.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      FLASK_DEBUG: "false"
    volumes:
      - chat-data:/app/src/python/temp

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - auth
      - chat

volumes:
  mysql-data:
  chat-data:
