<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- <meta http-equiv="Content-Security-Policy" 
      content="script-src 'self' https://esm.run https://cdn.jsdelivr.net 'unsafe-eval';"> -->
    <meta http-equiv="Content-Security-Policy" 
      content="script-src 'self' 'unsafe-inline' https://esm.run https://cdn.jsdelivr.net 'unsafe-eval';">
    <title>AI Chat - Full Screen</title>
    <link rel="stylesheet" href="style/style2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

</head>
<body>
    <div class="main-IA">
        <div class="overlay" id="overlay">
            <div class="setting-table">
                <div class="side">
                    <p class="head-set">
                        <button class="close-setting-table" aria-label="close" id="close-setting-table">
                            <span aria-hidden="true" class="sign">&times;</span>
                        </button>
                    </p>
                    <p class="navigation-option">
                        <button id="general">General</button>
                        <button id="notifications">Notifications</button>
                        <button id="personalization">Personalization</button>
                        <button id="apps">Apps</button>
                        <button id="data-control">Data Control</button>
                        <button id="security">Security</button>
                        <button id="parental-control">Parental control</button>
                        <button id="account">Account</button>
                    </p>
                </div>
                <div class="show-user-option">
                    <label for="color-picker"></label>
                    <input type="color" id="color-picker" style="display: none;" value="#0000ff">
                    <div class="general-option-disp" id="display-general" style="display: none;">
                        <h1 class="g-title">General</h1>
                        <button if="appearance selection">Appearance</button>
                        <button id="langage-selection">Language</button>
                        <button id="on-focus-color">Accent color</button>
                        <button id="langage-selection">Spoken language</button>
                        <button id="update-timezone">Update timezone</button>
                        <button id="voice-selection">Ai Voice</button>
                    </div>
                    <div class="notifications-option-disp" id="display-notifications" style="display: none;">
                        <h1 class="n-title">Notifications</h1>
                    </div>
                    <div class="personalization-option-disp" id="display-personalization" style="display: none;">
                        <h1 class="p-title">Personalization</h1>
                    </div>
                    <div class="apps-option-disp" id="display-apps" style="display: none;">
                        <h1 class="a-title">Apps</h1>
                    </div>
                    <div class="data-control-option-disp" id="display-data-control" style="display: none;">
                        <h1 class="d-c-title">Data Control</h1>
                    </div>
                    <div class="security-option-disp" id="display-security" style="display: none;">
                        <h1 class="s-title">Security</h1>
                    </div>
                    <div class="parental-control-option-disp" id="display-parental-control" style="display: none;">
                        <h1 class="p-c-title">Parental Control</h1>
                    </div>
                    <div class="account-option-disp" id="display-account" style="display: none;">
                        <h1 class="a-title">Account</h1>
                    </div>
                </div>
            </div>
        </div>
        <div class="user-option-close" id="user-o" style="display: none;">
            <div class="navigation-setting">
                <button class="setting-option" id="set-but">Setting</button>
                <button class="Profil" id="user-profil">Profil</button>
                <button class="logout"  id="logout-bttn">Logout</button>
            </div>
        </div>
        <div class="slide-bar" id="side">
            <div class="head_">
                <h1 class="program-name">My AI</h1>
                <button class="close-slidebar" id="close-side">
                    <img src="assets/previous.png" alt="close">
                </button>
            </div>
            <div class="chat-History"></div>
            <div class="setting">
                <button class="user-changment" id="open-u">X</button>
            </div>
        </div>
        <div class="reduct" id="reduct" style="display: none;">
            <div class="reduct-head">
                <button class="extend-slidebar" id="extend">
                    <img src="assets/right-arrows.png" alt="extend">
                </button>
            </div>
            <div class="chat-History"></div>
            <div class="user_reduct">
                <button class="user-changment-reduct" id="show-option">
                    <img src="assets/person.png" alt="picture">
                </button>
            </div>
        </div>
        <div class="main-message-input-container">
            <div class="chat-container">
                <div class="chat" id="main-chat">
                    <div class="model" id="chat-answer">
                    </div>
                </div>
            </div>
            <div class="input-area">
                <audio src=""></audio>
                <input type="file" id="join-image" accept="image/*" style="display: none;">
                <input type="file" id="join-doc" accept=".pdf,.doc,.docx,.xlsx,.txt" style="display: none;">

                <div class="paper-clip-overlay" id="load_files" style="display: none;">
                    <button class="image-loader" id="btn-image">
                        <img src="assets/paper-clip.png" alt="Image">
                    </button>
                    <button class="doc-loader" id="btn-doc">
                        <img src="assets/paper-clip.png" alt="Document">
                    </button>
                </div>
                <button class="paper-clip" id="show-load-options">
                    <img src="assets/paper-clip.png" alt="Join-files">
                </button>
                <button class="mic-button" id="audio-part">
                    <img src="assets/micro.png" alt="Voice input">
                </button>
                <textarea class="user-Input" rows="2" is="textarea-autogrow" id="user-Input" placeholder="Ask anything..."></textarea>
                <button class="send-icon" id="send-button">
                    <img src="assets/send.png" alt="Send message">
                </button>
            </div>
        </div>
        <div class="signup_and_signin" id="buttons-up-in">
            <button class="LogIn" id="sign-in" style="display: block;">Log In
                <a id="login-interface" href="login_signup.html" style="display: none;"></a>
            </button>
            <button class="SignUp" id="sign-up" style="display: block;">Sign up
                <a id="signup-interface" href="login_signup.html" style="display: none;"></a>
            </button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
    <script src="script2.js" type="module"></script>
    <script src="speech-part.js" type="module"></script>
</body>
</html>
