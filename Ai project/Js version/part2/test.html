<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title id="page-title">Multi-Language Site</title>
    <!-- Best practice: use UTF-8 encoding -->
</head>
<body>
    <header>
        <h1 data-i18n="welcome.title">Welcome to our website!</h1>
        <p data-i18n="welcome.subtitle">We are glad to see you here.</p>
    </header>

    <nav>
        <button onclick="changeLanguage('en')">English</button>
        <button onclick="changeLanguage('es')">Español</button>
        <button onclick="changeLanguage('fr')">Français</button>
    </nav>

    <main>
        <p data-i18n="main.content">This is the main content of the page.</p>
    </main>

    <script src="translations.js"></script>
    <script src="test.js"></script>
</body>
</html>
