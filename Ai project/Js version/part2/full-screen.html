<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - Full Screen</title>
    <link rel="stylesheet" href="style2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-IA">
        <div class="slide-bar" id="side">
            <button class="close-slidebar" id="close-side">
                <img src="previous.png" alt="close">
            </button>
            <div class="chat-History"></div>
            <div class="user-option-close" id="user-o" style="display: none;">
                <button class="Setting-option" id="">Setting</button>
                <button class="Profil" id="user-profil">Profil</button>
                <button class="logout"  id="logout-bttn">Logout</button>
            </div>
            <div class="setting">
                <button class="user-changment" id="open-u" testid="right"></button>
            </div>
        </div>
        <div class="reduct" id="reduct" style="display: none;">
            <button class="extend-slidebar" id="extend">
                <img src="right-arrows.png" alt="extend">
            </button>
            <div class="chat-History"></div>
            <div class="setting">
            </div>
        </div>
        <div class="chat-container">
            <div class="chat" id="main-chat">
                <div class="model" id="chat-answer">
                </div>
            </div>
            <div class="input-area">
                <input type="file" id="join" style="display: none;">
                <button class="paper-clip" id="add-button">
                    <img src="paper-clip.png" alt="Attach file">
                </button>
                <textarea class="user-Input" rows="2" is="textarea-autogrow" id="user-Input" placeholder="Ask anything..."></textarea>
                <button class="send-icon" id="send-button">
                    <img src="send.png" alt="Send message">
                </button>
            </div>
        </div>
    </div>
    
    <script type="importmap">
        {
            "imports": {
                "@google/generative-ai": "https://esm.run/@google/generative-ai"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module" src="script2.mjs"></script>
</body>
</html>
