<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- lien vers boostrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<style>
   @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Lavishly+Yours&display=swap');
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Inter", sans-serif;
}

body {
    width: 100%;
    min-height:  100vh;
    background: linear-gradient(#dbdaed, #9d9ad1);
}

#chatbot-toggler {
    position: fixed;
    bottom: 30px;
    right: 35px;
    height: 50px;
    width: 50px;
    border: none;
    display: flex;
    cursor: pointer;
    border-radius: 50%;
    background: #0b0470;
    align-items: center;
    justify-content: center;
}

#chatbot-toggler .ri-chat-4-fill {
    font-size: 1.3rem;
    position: absolute;
    color: #e8eaf6;
}

#chatbot-toggler .ri-close-large-line {
    font-size: 1.3rem;
    position: absolute;
    color: #e8eaf6;
}

.chatbot-popup {
    position: fixed;
    opacity: 0;
    pointer-events: none;
    bottom: 90px;
    right: 35px;
    width: 400px;
    transform: scale(0.2);
    height: 580px;
    overflow: hidden;
    background-color: #fff;
    border-radius: 15px;
    transform-origin: bottom right;
    box-shadow: none;
    transition: all 0.2s ease;
}

.container.show-chatbot .chatbot-popup{
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
}

.chatbot-popup .chat-header {
    display: flex;
    padding: 15px 22px;
    align-items: center;
    justify-content: space-between;
    background: #0b0470;
}

.chat-header .header-info {
    display: flex;
    align-items: center;
    gap: 10px;
}

.header-info svg {
    height: 40px;
    width: 40px;
    padding: 6px;
    flex-shrink: 0;
    fill: #0b0470;
    background: #e8eaf6;
    border-radius: 50%;
}

.header-info .logo-text {
    color: #e8eaf6;
    font-size: 1.31rem;
    font-weight: 600;
}

.chat-header button {
    height: 40px;
    width: 40px;
    border : none;
    outline : none;
    color: #e8eaf6;
    cursor: pointer;
    font-size: 1.9rem;
    padding-top: 2px;
    border-radius: 50%;
    margin-right: -10px;
    background: none;
    transition: 0.2s ease;
}

.chat-header button:hover {
   background: #241c8f;
   }

.chat-body {
    display: flex;
    flex-direction: column;
    gap: 20px;
    height: 460px;
    margin-bottom: 82px;
    overflow-y: auto;
    padding: 25px 22px;
}

.chat-body .message {
    display: flex;
    gap: 11px;
    align-items: center;
}

.chat-body .bot-message svg {
    height: 35px;
    width: 35px;
    padding: 6px;
    flex-shrink: 0;
    align-self: flex-end;
    fill: #e8eaf6;
    margin-bottom: 2px;
    background: #0b0470;
    border-radius: 50%;
}

.chat-body .message .message-text {
    padding: 12px 16px;
    max-width: 75%;
    word-wrap: break-word;
    white-space: pre-line;
    font-size: 0.95rem;
}

.chat-body .bot-message .message-text {
background: #e8eaf6;
border-radius: 13px 13px 13px 3px;
}

.chat-body .user-message {
    flex-direction: column;
    align-items: flex-end;
}

.chat-body .user-message .message-text{
    color: #e8eaf6;
    background: #0b0470;
    border-radius: 13px 13px 3px 13px;
}

.chat-footer {
    position: absolute;
    bottom: 0;
    width: 100% ;
    background: #fff;
    padding: 15px 22px 20px;
}

.chat-footer .chat-form {
    display: flex;
    align-items: center;
    background: #fff;
    border-radius: 32px;
    outline: 1px solid #cccce5;
    box-shadow: 0 0 8px 0 rgba(0, 0, 0, 0.06);
}

.chat-footer .chat-form:focus-within {
    outline: 2px solid #0b0470;
}

.chat-form {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    border-top: 1px solid #ddd;
}
.chat-form .message-input {
    border: none;
    outline: none;
    width: 100%;
    background: none;
    height : 47px;
    padding: 0 17px;
    font-size: 0.95rem;
}

.chat-form button {
    height: 35px;
    width: 35px;
    border: none;
    outline: none;
    cursor: pointer;
    font-size: 1.15rem;
    color: #fff;
    flex-shrink: 0;
    margin-right: 0px;
    border-radius: 50%;
    background: #0b0470;
    transition: 0.2s ease;
    display: none;
}

.attach-btn {
     height: 35px;
    width: 35px;
    border: none;
    outline: none;
    cursor: pointer;
    font-size: 1.15rem;
    color: #fff;
    flex-shrink: 0;
    margin-left: 0px;
    border-radius: 50%;
    background: #0b0470;
    display: flex;
    align-items: center;
    justify-content: center;
}

.chat-form button:hover {
    background: #120b75;
}

.chat-form .message-input:valid~button{
    display: block;
}

#file-preview {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 8px;
}

.file-tag {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #e8eaf6;
    color: #0b0470;
    padding: 6px 10px;
    border-radius: 12px;
    font-size: 0.85rem;
    font-weight: 500;
}

.file-tag button {
    border: none;
    background: transparent;
    cursor: pointer;
    color: #0b0470;
    font-size: 1rem;
    display: flex;
}
</style>

                  <h1 class="logo-text">Chatbot</h1>
                </div>
                <button class="material-symbols-rounded">
                    <i class="ri-arrow-down-s-line"></i>
                </button>
            </div>
            <!--chat body-->
            <div class="chat-body">

                <div class="message user-message">
                    <p class="message-text">I wanna know more about u</p>

            <!--chat footer-->
            <div class="chat-footer">
                <div id="file-preview"></div>
                <form action="#" class="chat-form">
                    <input type="text" placeholder="Type a message..." class="message-input" required/>
                    <button class="material-symbols-rounded" id="send-btn" type="submit">
                    <i class="ri-arrow-up-line"></i>
                    </button>
                     <input type="file" id="fileinput" hidden>
                     <label for="fileinput" class="attach-btn">

      <script type="importmap">
        {
            "imports": {
                "@google/generative-ai": "https://esm.run/@google/generative-ai"
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module" src="script.js"></script>
    <script>
        // Show/hide chatbot
        const toggler = 
        document.getElementById('chatbot-toggler');
        const container =
        document.querySelector('.container');
        toggler.addEventListener('click', () => {
            container.classList.toggle('show-chatbot');
        });

        // la flèche pour fermer le chatbot
        const closeBtn = document.querySelector('.chat-header button');
        closeBtn.addEventListener('click', () => {
            container.classList.remove('show-chatbot');
        });

        // cliquer en dehors du chatbot pour le fermer

        //afficher le nom du fichier sélectionné
        const fileInput = document.getElementById('fileinput');
        const filePreview = document.getElementById('file-preview');
        fileInput.addEventListener('change', () => {
            filePreview.innerHTML = ''; //reset à chaque nouveau choix

            if(fileInput.files.length > 0){
                const file = fileInput.files[0];
                
                const tag =
                document.createElement('div');
                tag.classList.add('file-tag');
                tag.innerHTML = `<span>${file.name}</span> <button class="remove-file"><i class="ri-close-fill"></i></button>`;

                filePreview.appendChild(tag);

                tag.querySelector('.remove-file').addEventListener('click', () => {
                    fileInput.value = ''; //reset l'input
                    filePreview.innerHTML = ''; //enlever l'aperçu
                });
            }
        });        
    </script>
